<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620">
  <defs>
    <style>
      .bg{fill:#f7fafc}
      .title{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}
      .txt{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:22px;font-weight:700;fill:#0f172a}
      .small{font-family:"Microsoft YaHei",Arial,sans-serif;font-size:16px;fill:#334155}
      .box-blue{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:10}
      .box-cyan{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:10}
      .box-amber{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:10}
      .arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .feedback{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="620"/>
  <text class="title" x="40" y="50">从设计意图到真实切削的主数据流</text>

  <g transform="translate(40,95)">
    <g transform="translate(0,0)">
      <rect class="box-blue" width="180" height="86" rx="10"/>
      <text class="txt" x="90" y="35" text-anchor="middle">CAD 模型</text>
      <text class="small" x="90" y="63" text-anchor="middle">STEP / 原生格式</text>
    </g>
    <g transform="translate(240,0)">
      <rect class="box-blue" width="180" height="86" rx="10"/>
      <text class="txt" x="90" y="35" text-anchor="middle">工程图</text>
      <text class="small" x="90" y="63" text-anchor="middle">公差 / PMI / 要求</text>
    </g>
    <g transform="translate(480,0)">
      <rect class="box-cyan" width="180" height="86" rx="10"/>
      <text class="txt" x="90" y="35" text-anchor="middle">工艺规划</text>
      <text class="small" x="90" y="63" text-anchor="middle">工序 / 装夹 / 基准</text>
    </g>
    <g transform="translate(720,0)">
      <rect class="box-cyan" width="180" height="86" rx="10"/>
      <text class="txt" x="90" y="35" text-anchor="middle">CAM 前置</text>
      <text class="small" x="90" y="63" text-anchor="middle">毛坯 / 刀具 / 机床</text>
    </g>
    <g transform="translate(960,0)">
      <rect class="box-amber" width="220" height="86" rx="10"/>
      <text class="txt" x="110" y="35" text-anchor="middle">刀路计算</text>
      <text class="small" x="110" y="63" text-anchor="middle">CL 点 / 刀轴 / 事件</text>
    </g>
    <line class="arrow" x1="180" y1="43" x2="230" y2="43"/>
    <line class="arrow" x1="420" y1="43" x2="470" y2="43"/>
    <line class="arrow" x1="660" y1="43" x2="710" y2="43"/>
    <line class="arrow" x1="900" y1="43" x2="950" y2="43"/>
  </g>

  <g transform="translate(140,275)">
    <g transform="translate(0,0)">
      <rect class="box-amber" width="220" height="86" rx="10"/>
      <text class="txt" x="110" y="35" text-anchor="middle">刀路仿真</text>
      <text class="small" x="110" y="63" text-anchor="middle">材料去除 / 碰撞</text>
    </g>
    <g transform="translate(300,0)">
      <rect class="box-amber" width="220" height="86" rx="10"/>
      <text class="txt" x="110" y="35" text-anchor="middle">后置处理</text>
      <text class="small" x="110" y="63" text-anchor="middle">机床语法 / 运动学</text>
    </g>
    <g transform="translate(600,0)">
      <rect class="box-blue" width="220" height="86" rx="10"/>
      <text class="txt" x="110" y="35" text-anchor="middle">NC 程序</text>
      <text class="small" x="110" y="63" text-anchor="middle">G 代码 / 循环 / 宏</text>
    </g>
    <g transform="translate(900,0)">
      <rect class="box-cyan" width="190" height="86" rx="10"/>
      <text class="txt" x="95" y="35" text-anchor="middle">机床加工</text>
      <text class="small" x="95" y="63" text-anchor="middle">对刀 / 试切 / 批量</text>
    </g>
    <line class="arrow" x1="220" y1="43" x2="290" y2="43"/>
    <line class="arrow" x1="520" y1="43" x2="590" y2="43"/>
    <line class="arrow" x1="820" y1="43" x2="890" y2="43"/>
  </g>

  <g transform="translate(360,465)">
    <g transform="translate(0,0)">
      <rect class="box-cyan" width="240" height="78" rx="10"/>
      <text class="txt" x="120" y="33" text-anchor="middle">检测</text>
      <text class="small" x="120" y="58" text-anchor="middle">CMM / 在机测量 / SPC</text>
    </g>
    <g transform="translate(340,0)">
      <rect class="box-cyan" width="290" height="78" rx="10"/>
      <text class="txt" x="145" y="33" text-anchor="middle">质量闭环</text>
      <text class="small" x="145" y="58" text-anchor="middle">刀补 / 工艺 / 模板优化</text>
    </g>
    <line class="arrow" x1="240" y1="39" x2="330" y2="39"/>
  </g>

  <path class="feedback" d="M990,465 C1125,405 1160,250 1110,185"/>
  <text class="small" x="1005" y="445">检测数据回流</text>
</svg>
